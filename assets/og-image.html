<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1200, initial-scale=1" />
<title>Lorenzo Trichard OG Image</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f4ee;
    color: #0e0e0c;
  }
  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 54px 64px;
    background:
      radial-gradient(rgba(14,14,12,0.055) 1px, transparent 1px),
      radial-gradient(rgba(14,14,12,0.04) 1px, transparent 1px),
      #f6f4ee;
    background-size: 4px 4px, 9px 9px;
    background-position: 0 0, 2px 3px;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: "JetBrains Mono", "SFMono-Regular", monospace;
    font-size: 19px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .brand, .status { display: flex; align-items: center; gap: 14px; }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #5cc974;
    box-shadow: 0 0 0 14px rgba(92,201,116,.16);
  }
  .eyebrow {
    margin-top: 64px;
    font-family: "JetBrains Mono", "SFMono-Regular", monospace;
    font-size: 18px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #7a776e;
  }
  h1 {
    width: 870px;
    margin: 24px 0 0;
    font-size: 82px;
    line-height: 0.96;
    letter-spacing: -0.055em;
    font-weight: 850;
  }
  .green { color: #5cc974; font-style: italic; }
  .pill {
    display: inline-flex;
    align-items: center;
    border-radius: 0.68em;
    padding: 0.02em 0.34em 0.09em;
    background: #ebfef3;
    color: #5cc974;
    font-style: italic;
    box-shadow: inset 0 0 0 1px rgba(92,201,116,.18);
  }
  .metrics {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 54px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1.5px solid rgba(14,14,12,.34);
    border-left: 1.5px solid rgba(14,14,12,.34);
  }
  .metric {
    min-height: 116px;
    padding: 22px 24px;
    border-right: 1.5px solid rgba(14,14,12,.34);
    border-bottom: 1.5px solid rgba(14,14,12,.34);
  }
  .label {
    font-family: "JetBrains Mono", "SFMono-Regular", monospace;
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #7a776e;
  }
  .value {
    margin-top: 12px;
    font-size: 36px;
    line-height: 1;
    font-weight: 850;
    letter-spacing: -0.045em;
  }
  .callout {
    position: absolute;
    right: 64px;
    top: 210px;
    width: 245px;
    padding: 18px 20px;
    border: 1.5px solid rgba(14,14,12,.34);
    background: rgba(235,254,243,.72);
  }
  .callout div:first-child {
    font-family: "JetBrains Mono", "SFMono-Regular", monospace;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #7a776e;
  }
  .callout div:last-child {
    margin-top: 10px;
    font-size: 22px;
    line-height: 1.18;
    font-weight: 800;
    letter-spacing: -0.035em;
  }
</style>
</head>
<body>
  <main class="canvas">
    <div class="top">
      <div class="brand"><span class="dot"></span><span>Lorenzo.Trichard</span></div>
      <div class="status"><span class="dot"></span><span>10 / 10 agents healthy</span></div>
    </div>

    <div class="eyebrow">// Portfolio Growth Operator</div>
    <h1>I <span class="green">build</span> growth systems that scale across <span class="pill">portfolio accounts</span>.</h1>

    <aside class="callout">
      <div>Client wink</div>
      <div>8 accounts → organic campaigns → automation roadmap</div>
    </aside>

    <section class="metrics">
      <div class="metric">
        <div class="label">Users acquired</div>
        <div class="value">3M+</div>
      </div>
      <div class="metric">
        <div class="label">Volume generated</div>
        <div class="value">$285M</div>
      </div>
      <div class="metric">
        <div class="label">AI workflows</div>
        <div class="value">10 agents</div>
      </div>
      <div class="metric">
        <div class="label">Built by</div>
        <div class="value">Personal AI agent</div>
      </div>
    </section>
  </main>
</body>
</html>
